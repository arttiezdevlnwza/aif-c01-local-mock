<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <rect width="1200" height="1600" fill="#f7fbff"/>
  <foreignObject x="0" y="0" width="1200" height="1600">
    <div xmlns="http://www.w3.org/1999/xhtml" class="page">
      <style>
        *{box-sizing:border-box} .page{width:1200px;height:1600px;padding:46px 52px 38px;font-family:Inter,"Segoe UI",Tahoma,sans-serif;color:#10264f;background:linear-gradient(180deg,#fff 0%,#f3f9ff 100%);overflow:hidden}
        .top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:18px}.brand{font-size:24px;font-weight:900;letter-spacing:.09em;color:#1f5fd6}.num{padding:9px 16px;border-radius:999px;background:#dff2ff;color:#175cd3;font-size:22px;font-weight:900}
        h1{font-size:44px;line-height:1.08;margin:6px 0 12px;color:#0f285f}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tag{padding:7px 11px;border-radius:999px;background:#e8f7f4;border:1px solid #bfe9df;color:#14705e;font-size:17px;font-weight:800}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.card{background:#fff;border:2px solid #d4e7f7;border-radius:18px;overflow:hidden;box-shadow:0 5px 16px rgba(31,95,214,.06);break-inside:avoid}
        .cardhead{display:flex;align-items:center;gap:10px;background:#eaf6ff;padding:12px 14px}.cardhead>span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#1f5fd6;color:#fff;font-size:18px;font-weight:900}.cardhead h2{margin:0;font-size:25px;line-height:1.2}
        ul{margin:0;padding:10px 20px 14px 34px}li{font-size:18px;line-height:1.34;margin:7px 0;color:#334e78}
        .goal{position:absolute;left:52px;right:52px;bottom:34px;background:#0f4d8a;color:#fff;border-radius:15px;padding:14px 20px;text-align:center;font-size:18px;font-weight:800}
        .foot{position:absolute;right:58px;bottom:8px;font-size:12px;color:#5b78a1}
      </style>
      <div class="top"><div><div class="brand">AIF-C01 INFO LIBRARY</div><h1>Security, Governance &amp; Compliance</h1><div class="tags"><span class="tag">SOC</span><span class="tag">IAM</span><span class="tag">Governance</span></div></div><div class="num">Page 3</div></div>
      <div class="grid"><section class="card"><div class="cardhead"><span>1</span><h2>Security / Governance Services</h2></div><ul><li>Artifact = AWS compliance reports</li><li>Audit Manager = audit evidence</li><li>Config = resource config/compliance</li><li>CloudTrail = who did what API when</li><li>Trusted Advisor = recommendations</li><li>Macie = sensitive data in S3</li><li>Inspector = vulnerabilities</li><li>KMS = encryption keys</li><li>PrivateLink = private service path</li></ul></section><section class="card"><div class="cardhead"><span>2</span><h2>IAM Family</h2></div><ul><li>Identity policy = grant to identity</li><li>Resource policy = resource grants access</li><li>Permissions Boundary = ceiling of identity</li><li>SCP = org/account ceiling</li><li>Role = assumable identity</li><li>Trust policy = who can assume</li><li>Explicit Deny wins</li></ul></section><section class="card"><div class="cardhead"><span>3</span><h2>SOC / ISO / Frameworks</h2></div><ul><li>SOC 1 = financial reporting controls</li><li>SOC 2 = detailed trust-services report</li><li>SOC 3 = public/general summary</li><li>ISO 27001 = ISMS</li><li>ISO 42001 = AI management system</li><li>NIST AI RMF = Govern/Map/Measure/Manage</li><li>EU AI Act = risk-based law</li><li>AWS CAF-AI = enterprise AI adoption guidance</li></ul></section><section class="card"><div class="cardhead"><span>4</span><h2>Data Governance</h2></div><ul><li>Owner = accountability</li><li>Steward = day-to-day governance</li><li>Lineage = source → transformations → artifact</li><li>Catalog = searchable metadata</li><li>Residency = where data stays</li><li>Retention = how long</li><li>Sovereignty = which jurisdiction/law</li></ul></section></div>
      <div class="goal">จำภาพรวมให้ได้ก่อน แล้วค่อยเจาะรายละเอียดจาก Topic Map / Mock Review</div>
      <div class="foot">AIF-C01 Local Mock · Infographic 3/20</div>
    </div>
  </foreignObject></svg>