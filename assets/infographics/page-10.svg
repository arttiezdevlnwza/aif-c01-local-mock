<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#f7fbff"/><foreignObject x="0" y="0" width="1200" height="1600"><div xmlns="http://www.w3.org/1999/xhtml" class="page"><style>*{box-sizing:border-box}.page{position:relative;width:1200px;height:1600px;padding:46px 52px 80px;font-family:Inter,"Segoe UI",Tahoma,sans-serif;color:#10264f;background:linear-gradient(180deg,#fff 0%,#f3f9ff 100%);overflow:hidden}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:18px}.brand{font-size:24px;font-weight:900;letter-spacing:.09em;color:#1f5fd6}.num{padding:9px 16px;border-radius:999px;background:#dff2ff;color:#175cd3;font-size:22px;font-weight:900}h1{font-size:44px;line-height:1.08;margin:6px 0 12px;color:#0f285f}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tag{padding:7px 11px;border-radius:999px;background:#e8f7f4;border:1px solid #bfe9df;color:#14705e;font-size:17px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.card{background:#fff;border:2px solid #d4e7f7;border-radius:18px;overflow:hidden;box-shadow:0 5px 16px rgba(31,95,214,.06);break-inside:avoid}.cardhead{display:flex;align-items:center;gap:10px;background:#eaf6ff;padding:12px 14px}.cardhead>span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#1f5fd6;color:#fff;font-size:18px;font-weight:900}.cardhead h2{margin:0;font-size:25px;line-height:1.2}ul{margin:0;padding:10px 20px 14px 34px}li{font-size:18px;line-height:1.34;margin:7px 0;color:#334e78}.goal{position:absolute;left:52px;right:52px;bottom:34px;background:#0f4d8a;color:#fff;border-radius:15px;padding:14px 20px;text-align:center;font-size:18px;font-weight:800}.foot{position:absolute;right:58px;bottom:8px;font-size:12px;color:#5b78a1}</style><div class="top"><div><div class="brand">AIF-C01 INFO LIBRARY</div><h1>Responsible AI Deep Dive</h1><div class="tags"><span class="tag">Bias</span><span class="tag">Fairness</span><span class="tag">Guardrails</span></div></div><div class="num">Page 10</div></div><div class="grid"><section class="card"><div class="cardhead"><span>1</span><h2>Responsible AI Principles</h2></div><ul><li>Fairness</li><li>Inclusivity</li><li>Explainability/Transparency</li><li>Privacy &amp; Security</li><li>Safety</li><li>Controllability</li><li>Veracity/Robustness</li><li>Governance</li><li>Sustainability</li></ul></section><section class="card"><div class="cardhead"><span>2</span><h2>Responsible AI Lifecycle</h2></div><ul><li>Define intended use/users → Representative data → Evaluate groups/risks → Document limits → Controls + Human oversight → Monitor</li></ul></section><section class="card"><div class="cardhead"><span>3</span><h2>Bias Types</h2></div><ul><li>Sampling/Selection</li><li>Measurement/Label</li><li>Historical</li><li>Proxy</li><li>Automation bias</li><li>Class/Subgroup imbalance</li></ul></section><section class="card"><div class="cardhead"><span>4</span><h2>Explainability &amp; Transparency</h2></div><ul><li>Intrinsic interpretability</li><li>Post-hoc explainability</li><li>Black box</li><li>Model Card = our model</li><li>AI Service Card = AWS-managed AI service documentation</li></ul></section><section class="card"><div class="cardhead"><span>5</span><h2>Fairness Metrics</h2></div><ul><li>DPL = before training / labels in dataset</li><li>DPPL = after training / predictions</li><li>Recall Difference</li><li>Specificity Difference</li><li>Accuracy Difference</li><li>Treatment Equality</li><li>Disparate Impact</li></ul></section><section class="card"><div class="cardhead"><span>6</span><h2>Bedrock Guardrails</h2></div><ul><li>Content filters</li><li>Denied topics</li><li>Word/Phrase filters</li><li>Sensitive information</li><li>Prompt attack</li><li>Contextual grounding</li><li>Automated Reasoning</li><li>ApplyGuardrail API</li><li>Grounding = evidence/context; Automated Reasoning = formal rules/logic</li><li>Guardrails ≠ Macie</li></ul></section></div><div class="goal">จำภาพรวมให้ได้ก่อน แล้วค่อยเจาะรายละเอียดจาก Topic Map / Mock Review</div><div class="foot">AIF-C01 Local Mock · Infographic 10/20</div></div></foreignObject></svg>