s</h1><div class="tags"><span class="tag">Governance</span><span class="tag">Compliance</span><span class="tag">EU AI Act</span></div></div><div class="num">Page 12</div></div><div class="grid"><section class="card"><div class="cardhead"><span>1</span><h2>Audit / Compliance Services</h2></div><ul><li>Artifact</li><li>Audit Manager</li><li>Config</li><li>CloudTrail</li><li>Inspector</li><li>Trusted Advisor</li><li>Well-Architected Tool</li></ul></section><section class="card"><div class="cardhead"><span>2</span><h2>Data Governance Terms</h2></div><ul><li>Owner</li><li>Steward</li><li>Lineage</li><li>Retention</li><li>Residency</li><li>Sovereignty</li><li>Classification</li><li>Glue Data Catalog / Lake Formation</li><li>ML Lineage vs Registry</li></ul></section><section class="card"><div class="cardhead"><span>3</span><h2>S3 Lifecycle / Storage</h2></div><ul><li>Standard</li><li>Standard-IA</li><li>One Zone-IA</li><li>Intelligent-Tiering</li><li>Glacier / Deep Archive</li></ul></section><section class="card"><div class="cardhead"><span>4</span><h2>Frameworks &amp; Standards</h2></div><ul><li>NIST AI RMF</li><li>AWS CAF-AI</li><li>GenAI Security Scoping Matrix</li><li>SOC 1</li><li>SOC 2</li><li>SOC 3</li><li>ISO 27001</li><li>ISO 42001</li></ul></section><section class="card"><div class="cardhead"><span>5</span><h2>EU AI Act</h2></div><ul><li>Unacceptable / Prohibited</li><li>High risk</li><li>Limited / Transparency</li><li>Minimal</li><li>Focus on use case + impact on rights/safety</li></ul></section><section class="card"><div class="cardhead"><span>6</span><h2>Governance Process</h2></div><ul><li>Policies → Review cadence → Review strategy → Transparency standards → Team training</li></ul></section></div><div class="goal">จำภาพรวมให้ได้ก่อน แล้วค่อยเจาะรายละเอียดจาก Topic Map / Mock Review</div><div class="foot">AIF-C01 Local Mock · Infographic 12/20</div></div></foreignObject></svg>