<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#f7fbff"/><foreignObject x="0" y="0" width="1200" height="1600"><div xmlns="http://www.w3.org/1999/xhtml" class="page"><style>*{box-sizing:border-box}.page{position:relative;width:1200px;height:1600px;padding:46px 52px 80px;font-family:Inter,"Segoe UI",Tahoma,sans-serif;color:#10264f;background:linear-gradient(180deg,#fff 0%,#f3f9ff 100%);overflow:hidden}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:18px}.brand{font-size:24px;font-weight:900;letter-spacing:.09em;color:#1f5fd6}.num{padding:9px 16px;border-radius:999px;background:#dff2ff;color:#175cd3;font-size:22px;font-weight:900}h1{font-size:44px;line-height:1.08;margin:6px 0 12px;color:#0f285f}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tag{padding:7px 11px;border-radius:999px;background:#e8f7f4;border:1px solid #bfe9df;color:#14705e;font-size:17px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.card{background:#fff;border:2px solid #d4e7f7;border-radius:18px;overflow:hidden;box-shadow:0 5px 16px rgba(31,95,214,.06);break-inside:avoid}.cardhead{display:flex;align-items:center;gap:10px;background:#eaf6ff;padding:12px 14px}.cardhead>span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#1f5fd6;color:#fff;font-size:18px;font-weight:900}.cardhead h2{margin:0;font-size:25px;line-height:1.2}ul{margin:0;padding:10px 20px 14px 34px}li{font-size:18px;line-height:1.34;margin:7px 0;color:#334e78}.goal{position:absolute;left:52px;right:52px;bottom:34px;background:#0f4d8a;color:#fff;border-radius:15px;padding:14px 20px;text-align:center;font-size:18px;font-weight:800}.foot{position:absolute;right:58px;bottom:8px;font-size:12px;color:#5b78a1}</style><div class="top"><div><div class="brand">AIF-C01 INFO LIBRARY</div><h1>AI / ML Fundamentals Map</h1><div class="tags"><span class="tag">AI/ML</span><span class="tag">Fundamentals</span><span class="tag">Learning Types</span></div></div><div class="num">Page 13</div></div><div class="grid"><section class="card"><div class="cardhead"><span>1</span><h2>Concept Ladder</h2></div><ul><li>AI → ML → DL</li><li>GenAI = create new content</li><li>LLM = language-focused FM</li><li>Agentic AI = goal → plan → act → observe</li></ul></section><section class="card"><div class="cardhead"><span>2</span><h2>Core Terms</h2></div><ul><li>Algorithm = learning method</li><li>Model = result after training</li><li>Training = learn parameters</li><li>Inference = use trained model</li><li>Deterministic = same rule/output</li><li>Probabilistic = probability-based output</li></ul></section><section class="card"><div class="cardhead"><span>3</span><h2>Feature / Label / Parameter</h2></div><ul><li>Feature = input</li><li>Label/Target = supervised ground truth</li><li>Parameter = learned values</li><li>Hyperparameter = set before training</li></ul></section><section class="card"><div class="cardhead"><span>4</span><h2>Data Types</h2></div><ul><li>Structured</li><li>Semi-structured</li><li>Unstructured</li><li>Time-series</li><li>Labeled / Unlabeled</li></ul></section><section class="card"><div class="cardhead"><span>5</span><h2>Learning Types</h2></div><ul><li>Supervised</li><li>Unsupervised</li><li>Self-supervised</li><li>Reinforcement Learning: State → Action → Reward/Penalty → Policy</li></ul></section><section class="card"><div class="cardhead"><span>6</span><h2>CV / NLP / Speech</h2></div><ul><li>CV = image/video</li><li>NLP = text/language</li><li>Speech = spoken audio</li><li>Neural network: Input → Hidden layers → Output</li></ul></section></div><div class="goal">จำภาพรวมให้ได้ก่อน แล้วค่อยเจาะรายละเอียดจาก Topic Map / Mock Review</div><div class="foot">AIF-C01 Local Mock · Infographic 13/20</div></div></foreignObject></svg>