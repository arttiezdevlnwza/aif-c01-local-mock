Business Value</h1><div class="tags"><span class="tag">GenAI</span><span class="tag">Business Value</span><span class="tag">Limitations</span></div></div><div class="num">Page 19</div></div><div class="grid"><section class="card"><div class="cardhead"><span>1</span><h2>Common Use Cases</h2></div><ul><li>Text / image / video / audio / code generation</li><li>Summarization</li><li>Translation</li><li>Assistants / agents</li><li>Customer service</li><li>Search / recommendation</li></ul></section><section class="card"><div class="cardhead"><span>2</span><h2>Strengths</h2></div><ul><li>Adaptability</li><li>Responsiveness</li><li>Conversational UX</li><li>Content creation</li><li>Speed-to-market</li><li>Efficiency / cost-effectiveness / accessibility</li></ul></section><section class="card"><div class="cardhead"><span>3</span><h2>Limitations / Risks</h2></div><ul><li>Hallucination</li><li>Inaccuracy</li><li>Nondeterminism</li><li>Interpretability limitations</li><li>Cost / latency</li></ul></section><section class="card"><div class="cardhead"><span>4</span><h2>Business Metrics</h2></div><ul><li>ROI</li><li>Efficiency</li><li>Conversion</li><li>ARPU</li><li>CLV</li><li>Task success</li><li>Customer feedback</li><li>Accuracy</li><li>Cross-domain performance</li></ul></section><section class="card"><div class="cardhead"><span>5</span><h2>Traditional ML vs FM</h2></div><ul><li>Traditional ML = narrow/cheaper/more interpretable</li><li>FM = broad/reusable/flexible/general-purpose</li></ul></section><section class="card"><div class="cardhead"><span>6</span><h2>Quick Selection Cue</h2></div><ul><li>If a simple deterministic audited rule already defines the exact answer, AI/ML may be unnecessary</li><li>Business metric ≠ model metric</li><li>Choose technique by task, not model size</li></ul></section></div><div class="goal">จำภาพรวมให้ได้ก่อน แล้วค่อยเจาะรายละเอียดจาก Topic Map / Mock Review</div><div class="foot">AIF-C01 Local Mock · Infographic 19/20</div></div></foreignObject>