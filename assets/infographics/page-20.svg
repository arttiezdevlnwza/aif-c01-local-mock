<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#f7fbff"/><foreignObject x="0" y="0" width="1200" height="1600"><div xmlns="http://www.w3.org/1999/xhtml" class="page"><style>*{box-sizing:border-box}.page{position:relative;width:1200px;height:1600px;padding:46px 52px 80px;font-family:Inter,"Segoe UI",Tahoma,sans-serif;color:#10264f;background:linear-gradient(180deg,#fff 0%,#f3f9ff 100%);overflow:hidden}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:18px}.brand{font-size:24px;font-weight:900;letter-spacing:.09em;color:#1f5fd6}.num{padding:9px 16px;border-radius:999px;background:#dff2ff;color:#175cd3;font-size:22px;font-weight:900}h1{font-size:44px;line-height:1.08;margin:6px 0 12px;color:#0f285f}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tag{padding:7px 11px;border-radius:999px;background:#e8f7f4;border:1px solid #bfe9df;color:#14705e;font-size:17px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.card{background:#fff;border:2px solid #d4e7f7;border-radius:18px;overflow:hidden;box-shadow:0 5px 16px rgba(31,95,214,.06);break-inside:avoid}.cardhead{display:flex;align-items:center;gap:10px;background:#eaf6ff;padding:12px 14px}.cardhead>span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#1f5fd6;color:#fff;font-size:18px;font-weight:900}.cardhead h2{margin:0;font-size:25px;line-height:1.2}ul{margin:0;padding:10px 20px 14px 34px}li{font-size:18px;line-height:1.34;margin:7px 0;color:#334e78}.goal{position:absolute;left:52px;right:52px;bottom:34px;background:#0f4d8a;color:#fff;border-radius:15px;padding:14px 20px;text-align:center;font-size:18px;font-weight:800}.foot{position:absolute;right:58px;bottom:8px;font-size:12px;color:#5b78a1}</style><div class="top"><div><div class="brand">AIF-C01 INFO LIBRARY</div><h1>AWS Service Finder / Exam Clue Map</h1><div class="tags"><span class="tag">AWS Services</span><span class="tag">Exam Clues</span><span class="tag">Service Map</span></div></div><div class="num">Page 20</div></div><div class="grid"><section class="card"><div class="cardhead"><span>1</span><h2>ML / AI</h2></div><ul><li>Bedrock / AgentCore = GenAI / agents</li><li>Comprehend = NLP</li><li>Lex = chatbot</li><li>Nova = foundation models</li><li>Personalize = recommendation</li><li>Polly = text-to-speech</li><li>Rekognition = image/video</li><li>SageMaker AI = custom ML</li><li>JumpStart = model hub</li><li>Textract = document OCR/forms/tables</li><li>Transcribe = speech-to-text</li><li>Translate = translation</li></ul></section><section class="card"><div class="cardhead"><span>2</span><h2>Analytics / Data</h2></div><ul><li>Data Exchange = third-party datasets</li><li>EMR = big data</li><li>Glue = ETL/Catalog/Crawler</li><li>Glue Data Quality = DQ rules</li><li>DataBrew = visual/no-code prep</li><li>Lake Formation = data lake permissions</li><li>OpenSearch = search/vector</li><li>Quick = business AI workspace</li><li>Redshift = warehouse</li></ul></section><section class="card"><div class="cardhead"><span>3</span><h2>Dev / Database</h2></div><ul><li>Kiro = spec-driven development</li><li>Strands Agents = agent SDK</li><li>Aurora/RDS = relational</li><li>DocumentDB = document</li><li>DynamoDB = NoSQL</li><li>ElastiCache = cache</li><li>Neptune = graph</li></ul></section><section class="card"><div class="cardhead"><span>4</span><h2>Compute / Storage</h2></div><ul><li>EC2 = VM</li><li>Lambda = serverless functions</li><li>ECS = containers</li><li>EKS = Kubernetes</li><li>S3 = object storage/data lake</li><li>S3 Glacier = archive</li></ul></section><section class="card"><div class="cardhead"><span>5</span><h2>Security / Governance</h2></div><ul><li>Artifact</li><li>IAM</li><li>Inspector</li><li>KMS</li><li>Macie</li><li>Secrets Manager</li></ul></section><section class="card"><div class="cardhead"><span>6</span><h2>Management / Network / Cost</h2></div><ul><li>CloudTrail = API audit</li><li>CloudWatch = metrics/logs/alarms</li><li>Config = resource state/compliance</li><li>Trusted Advisor = recommendations</li><li>Well-Architected Tool = architecture review</li><li>CloudFront = CDN</li><li>VPC = network isolation</li><li>Budgets = thresholds/alerts</li><li>Cost Explorer = cost analysis</li></ul></section><section class="card"><div class="cardhead"><span>7</span><h2>Extra Exam Clues</h2></div><ul><li>Q Business = enterprise knowledge assistant</li><li>Q Developer = coding/AWS assistant</li><li>Kendra = enterprise search</li><li>PartyRock = no-code GenAI playground (legacy)</li></ul></section></div><div class="goal">จำภาพรวมให้ได้ก่อน แล้วค่อยเจาะรายละเอียดจาก Topic Map / Mock Review</div><div class="foot">AIF-C01 Local Mock · Infographic 20/20</div></div></foreignObject></svg>